<!DOCTYPE html>
<html lang="ru">

<head>
    <!-- ===== Базовые настройки документа ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — ПАУЗА</title>

    <!-- ===== Подключение шрифта Manrope ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ===== Основные стили проекта ===== -->
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <!-- ========================================================== -->
    <!-- ===== СТРАНИЦА АВТОРИЗАЦИИ ===== -->
    <!-- ========================================================== -->
    <main class="auth-page">

        <!-- ===== Верхняя панель (шапка) с кнопкой "Назад" ===== -->
        <header class="header-bar">

            <!-- ===== Кнопка возврата ===== -->
            <button class="header-back" type="button">
                <img src="../assets/icons/arrow-left.svg" alt="Назад">
            </button>

        </header>

        <!-- ===== Заголовок страницы ===== -->
        <div class="title-group">

            <h2 class="auth-title">
                Чтобы сохранить паузу —<br>
                войдите в профиль
            </h2>

        </div>

        <!-- ===== Переключатель способа входа (Email / Телефон) ===== -->
        <div class="segment-tabs">

            <button class="tab-active" type="button">
                Email
            </button>

            <button class="tab-inactive" type="button">
                Телефон
            </button>

        </div>

        <!-- ===== Форма авторизации ===== -->
        <form class="auth-form">

            <!-- ===== Поле ввода Email ===== -->
            <div class="form-field">

                <label for="email">
                    EMAIL
                </label>

                <div class="input-container">

                    <input
                        id="email"
                        type="email"
                        placeholder="Введите email"
                    >

                </div>

            </div>

            <!-- ===== Поле ввода Пароля с кнопкой показа/скрытия ===== -->
            <div class="form-field">

                <label for="password">
                    ПАРОЛЬ
                </label>

                <div class="input-container password-container">

                    <input
                        id="password"
                        type="password"
                        placeholder="Введите пароль"
                    >

                    <!-- ===== Кнопка-переключатель видимости пароля ===== -->
                    <button
                        class="password-toggle"
                        type="button"
                        aria-label="Показать пароль"
                    >
                        <img
                            src="../assets/icons/eye.svg"
                            alt=""
                        >
                    </button>

                </div>

            </div>

        </form>

        <!-- ===== Основная кнопка "Войти" ===== -->
        <button class="button-primary auth-submit" type="button">
            Войти
        </button>

        <!-- ===== Ссылка на страницу регистрации ===== -->
        <p class="auth-switch">
            <span>Нет аккаунта? </span>
            <a href="registration.html">Регистрация</a>
        </p>

    </main>

    <!-- ===== Подключение JavaScript ===== -->
    <script src="../js/script.js"></script>

</body>
</html>

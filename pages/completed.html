<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Пауза завершена — ПАУЗА</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

<main class="completed-page">

    <!-- Иконка завершения -->
    <div class="checkmark-circle">
        <img
            src="../assets/icons/check-circle.svg"
            alt="Пауза завершена"
        >
    </div>


    <!-- Текст -->
    <div class="congrats-text">

        <h2>
            Пауза завершена
        </h2>

        <p>
            Спасибо, что уделили себе время и внимание.
        </p>

    </div>


    <!-- Информация о паузе -->
    <section class="meta-info-card">

        <div class="meta-row">
            <img
                src="../assets/icons/calendar.svg"
                alt=""
            >

            <span>
                19 августа 2026, 14:32
            </span>
        </div>

        <div class="meta-row">
            <img
                src="../assets/icons/clock.svg"
                alt=""
            >

            <span>
                Время паузы: 03:17
            </span>
        </div>

    </section>


    <!-- Действия -->
    <a
        class="button-primary completed-button"
        href="history.html"
    >
        Смотреть мои паузы
    </a>

    <a
        class="completed-home-link"
        href="home.html"
    >
        На главную
    </a>

</main>

<script src="../js/script.js"></script>

</body>
</html>

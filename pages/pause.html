<!DOCTYPE html>
<html lang="ru">

<head>
    <!-- ====================================================== -->
    <!-- БАЗОВЫЕ НАСТРОЙКИ -->
    <!-- ====================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Пауза — ПАУЗА</title>

    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">

    <!-- ====================================================== -->
    <!-- ШРИФТ MANROPE -->
    <!-- ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ====================================================== -->
    <!-- ЕДИНЫЙ ФАЙЛ СТИЛЕЙ -->
    <!-- ====================================================== -->

    <link rel="stylesheet" href="../style/style.css">
</head>


<body>


    <!-- ====================================================== -->
    <!-- СТРАНИЦА ПАУЗЫ -->
    <!--
        Общего desktop-хедера и нижнего меню здесь нет.
        Пользователь находится внутри отдельного сценария паузы.
    -->
    <!-- ====================================================== -->

    <main class="pause-page">


        <!-- ================================================== -->
        <!-- ЛОКАЛЬНАЯ ШАПКА -->
        <!--
            Классы header-back и pause-time сохранены,
            потому что их использт script.js.
        -->
        <!-- ================================================== -->

        <header class="header-bar">

            <!-- Назад на главную -->

            <button class="header-back" type="button" aria-label="Вернуться на главную">

                <!--
                    Inline SVG позволяет менять цвет стрелки
                    через CSS-свойство color.
                -->

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    aria-hidden="true">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>

            </button>


            <!-- Заголовок -->

            <h1 class="header-title">
                Вернуться назад
            </h1>


            <!-- Таймер заполняется через script.js -->

            <div class="pause-time" aria-live="polite">
                00:00
            </div>

        </header>


        <!-- ================================================== -->
        <!-- ПЕРВЫЙ ВОПРОС -->
        <!-- ================================================== -->

        <section class="question-card" aria-labelledby="question-feelings">

            <h2 class="question-title" id="question-feelings">
                1. Что ты сейчас чувствуешь?
            </h2>


            <!-- Поле ответа -->

            <div class="input-wrapper">

                <textarea aria-labelledby="question-feelings" placeholder="Напишите здесь..."></textarea>

            </div>


            <!-- Быстрые варианты -->

            <div class="question-chips">

                <button class="chip" type="button">усталость</button>
                <button class="chip" type="button">напряжение</button>
                <button class="chip" type="button">грусть</button>
                <button class="chip" type="button">радость</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- ВТОРОЙ ВОПРОС -->
        <!-- ================================================== -->

        <section class="question-card" aria-labelledby="question-thoughts">

            <h2 class="question-title" id="question-thoughts">
                2. Что сейчас занимает твои мысли?
            </h2>


            <!-- Поле ответа -->

            <div class="input-wrapper">

                <textarea aria-labelledby="question-thoughts" placeholder="Напишите здесь..."></textarea>

            </div>


            <!-- Быстрые варианты -->

            <div class="question-chips">

                <button class="chip" type="button">работа</button>
                <button class="chip" type="button">отношения</button>
                <button class="chip" type="button">будущее</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- ТРЕТИЙ ВОПРОС -->
        <!-- ================================================== -->

        <section class="question-card" aria-labelledby="question-support">

            <h2 class="question-title" id="question-support">
                3. Что тебе хочется сказать себе сейчас?
            </h2>


            <!-- Поле ответа -->

            <div class="input-wrapper">

                <textarea aria-labelledby="question-support" placeholder="Напишите здесь..."></textarea>

            </div>


            <!-- Быстрые варианты -->

            <div class="question-chips">

                <button class="chip" type="button">отдохни</button>
                <button class="chip" type="button">я справлюсь</button>
                <button class="chip" type="button">я устал</button>
                <button class="chip" type="button">больше не могу</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>


        <!-- ================================================== -->
        <!-- ЗАВЕРШЕНИЕ ПАУЗЫ -->
        <!--
            Класс pause-complete-button сохранён для script.js.
        -->
        <!-- ================================================== -->

        <button class="button-primary pause-complete-button" type="button">
            Завершить паузу
        </button>


    </main>


    <!-- ====================================================== -->
    <!-- DESKTOP: МОДАЛЬНОЕ ОКНО ЗАВЕРШЕНИЯ ПАУЗЫ -->
    <!--
        На экранах от 1200px JavaScript откроет это окно после
        сохранения ответов. На мобильном пользователь, как и
        раньше, перейдёт на отдельную страницу completed.html.

        У модалки собственные классы completed-modal-*.
        Поэтому она не пересекается с модалкой авторизации.
    -->
    <!-- ====================================================== -->

    <div class="completed-modal" role="dialog" aria-modal="true" aria-hidden="true"
        aria-labelledby="completed-modal-heading">

        <!-- Затемнённый фон -->

        <div class="completed-modal-overlay"></div>


        <!-- Карточка и кнопка закрытия -->

        <div class="completed-modal-wrapper">

            <div class="completed-modal-card">

                <!-- Иконка завершения -->

                <div class="checkmark-circle" aria-hidden="true">
                    <img src="../assets/icons/check-circle.svg" alt="">
                </div>


                <!-- Заголовок и пояснение -->

                <div class="completed-modal-title-block">

                    <h2 id="completed-modal-heading">
                        Пауза завершена
                    </h2>

                    <p>
                        Спасибо, что уделили себе время и внимание.
                    </p>

                </div>


                <!-- Дата и продолжительность заполняются через JS -->

                <section class="meta-info-card" aria-label="Информация о завершённой паузе">

                    <div class="meta-row">

                        <svg class="meta-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path
                                d="M19.2 11.091H4.8v8.181c0 .502.403.91.9.91h12.6c.497 0 .9-.408.9-.91zm-4.5-4.546v-.909H9.3v.909a.905.905 0 0 1-.9.91.905.905 0 0 1-.9-.91v-.909H5.7c-.497 0-.9.407-.9.909v2.728h14.4V6.545a.905.905 0 0 0-.9-.909h-1.8v.909a.905.905 0 0 1-.9.91.905.905 0 0 1-.9-.91M21 19.272C21 20.778 19.791 22 18.3 22H5.7C4.209 22 3 20.778 3 19.272V6.545c0-1.506 1.209-2.727 2.7-2.727h1.8v-.909c0-.502.403-.909.9-.909s.9.407.9.909v.909h5.4v-.909c0-.502.403-.909.9-.909s.9.407.9.909v.909h1.8c1.491 0 2.7 1.221 2.7 2.727z" />
                        </svg>

                        <span class="completed-modal-date">
                            Дата паузы
                        </span>

                    </div>

                    <div class="meta-row">

                        <svg class="meta-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path
                                d="M20.182 12c0-4.589-3.698-8.248-8.182-8.248S3.818 7.41 3.818 12 7.516 20.248 12 20.248 20.182 16.59 20.182 12m-9.091-5.474c0-.484.407-.876.909-.876s.909.392.909.876v4.942l3.147 1.58a.86.86 0 0 1 .386 1.181.926.926 0 0 1-1.226.373l-4.125-2.07zM22 12c0 5.489-4.443 10-10 10S2 17.49 2 12C2 6.512 6.443 2 12 2s10 4.512 10 10" />
                        </svg>

                        <span class="completed-modal-duration">
                            Время паузы: 00:00
                        </span>

                    </div>

                </section>


                <!-- Переходы после завершения -->

                <a class="button-primary completed-button" href="history.html">
                    Смотреть мои паузы
                </a>

                <a class="completed-home-link" href="home.html">
                    На главную
                </a>

            </div>


            <!--
                После завершения паузы крестик возвращает
                пользователя на главную страницу.
            -->

            <button class="completed-modal-close" type="button" aria-label="Закрыть и перейти на главную">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true">
                    <path
                        d="M3.463 2.251a.857.857 0 0 0-1.212 1.212L10.788 12 2.25 20.537a.857.857 0 0 0 1.212 1.212L12 13.212l8.537 8.537a.857.857 0 0 0 1.212-1.212L13.212 12l8.537-8.537a.857.857 0 0 0-1.212-1.212L12 10.788z" />
                </svg>

            </button>

        </div>

    </div>


    <!-- ====================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="../js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- ===== Базовые настройки документа ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Задай себе эти вопросы</title>

    <!-- ===== Подключение шрифта Manrope ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ===== Основные стили проекта ===== -->
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <!-- ========================================================== -->
    <!-- ===== СТРАНИЦА ПАУЗЫ (опросник) ===== -->
    <!-- ========================================================== -->
    <main class="pause-page">

        <!-- ===== Верхняя панель (шапка) ===== -->
        <header class="header-bar">

            <!-- ===== Кнопка "Назад" ===== -->
            <button class="header-back" type="button">
                <img src="../assets/icons/arrow-left.svg" alt="Назад">
            </button>

            <!-- ===== Заголовок страницы ===== -->
            <h1 class="header-title">
                Пауза
            </h1>

            <!-- ===== Таймер паузы ===== -->
            <div class="pause-time">
                00:00
            </div>

        </header>

        <!-- ===== Первый вопрос ===== -->
        <section class="question-card">

            <h3 class="question-title">
                1. Что ты сейчас чувствуешь?
            </h3>

            <!-- ===== Поле для ввода текста ===== -->
            <div class="input-wrapper">
        
                <textarea
                    placeholder="Напишите здесь..."
                ></textarea>

            </div>

            <!-- ===== Быстрые варианты-подсказки (чипсы) ===== -->
            <div class="question-chips">

                <button class="chip" type="button">усталость</button>
                <button class="chip" type="button">напряжение</button>
                <button class="chip" type="button">грусть</button>
                <button class="chip" type="button">радость</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>

        <!-- ===== Второй вопрос ===== -->
        <section class="question-card">

            <h3 class="question-title">
                2. Что сейчас занимает твои мысли?
            </h3>

            <!-- ===== Поле для ввода текста ===== -->
            <div class="input-wrapper">
        
                <textarea
                    placeholder="Напишите здесь..."
                ></textarea>

            </div>

            <!-- ===== Быстрые варианты-подсказки ===== -->
            <div class="question-chips">

                <button class="chip" type="button">работа</button>
                <button class="chip" type="button">отношения</button>
                <button class="chip" type="button">будущее</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>

        <!-- ===== Третий вопрос ===== -->
        <section class="question-card">

            <h3 class="question-title">
                3. Что тебе хочется сказать себе сейчас?
            </h3>

            <!-- ===== Поле для ввода текста ===== -->
            <div class="input-wrapper">
        
                <textarea
                    placeholder="Напишите здесь..."
                ></textarea>

            </div>

            <!-- ===== Быстрые варианты-подсказки ===== -->
            <div class="question-chips">

                <button class="chip" type="button">отдохни</button>
                <button class="chip" type="button">я справлюсь</button>
                <button class="chip" type="button">я устал</button>
                <button class="chip" type="button">больше не могу</button>
                <button class="chip" type="button">другое</button>

            </div>

        </section>

        <!-- ===== Кнопка завершения паузы ===== -->
        <button class="button-primary" type="button">
            Завершить паузу
        </button>

    </main>

    <!-- ===== Подключение JavaScript ===== -->
    <script src="../js/script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мои паузы — ПАУЗА</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

<main class="history-page">

    <!-- Шапка -->
    <header class="header-bar">

        <button class="header-back" type="button">
            <img src="../assets/icons/arrow-left.svg" alt="Назад">
        </button>

        <h1 class="header-title">
            Мои паузы
        </h1>

    </header>


    <!-- Список пауз -->
    <div class="pauses-list">

        <!-- Сегодня -->
        <section class="pause-section">

            <h2 class="section-label">
                СЕГОДНЯ
            </h2>


            <!-- Пауза 1 -->
            <article class="pause-card">

                <div class="pause-card-header">

                    <span class="pause-duration">
                        03:17
                    </span>

                    <time class="pause-card-time">
                        14:32
                    </time>

                </div>


                <div class="pause-card-content">

                    <p>
                        <strong>Чувства:</strong>
                        <span>тревога, усталость</span>
                    </p>

                    <p>
                        <strong>Мысли:</strong>
                        <span>работа, много задач</span>
                    </p>

                    <p>
                        <strong>Себе:</strong>
                        <span>«Хватит спешить. Я делаю достаточно.»</span>
                    </p>

                </div>

            </article>


            <!-- Пауза 2 -->
            <article class="pause-card">

                <div class="pause-card-header">

                    <span class="pause-duration">
                        01:42
                    </span>

                    <time class="pause-card-time">
                        11:08
                    </time>

                </div>


                <div class="pause-card-content">

                    <p>
                        <strong>Чувства:</strong>
                        <span>спокойствие</span>
                    </p>

                    <p>
                        <strong>Мысли:</strong>
                        <span>семья</span>
                    </p>

                </div>

            </article>

        </section>


        <!-- Вчера -->
        <section class="pause-section">

            <h2 class="section-label">
                ВЧЕРА
            </h2>


            <!-- Пауза 3 -->
            <article class="pause-card">

                <div class="pause-card-header">

                    <span class="pause-duration">
                        02:45
                    </span>

                    <time class="pause-card-time">
                        21:10
                    </time>

                </div>


                <div class="pause-card-content">

                    <p>
                        <strong>Чувства:</strong>
                        <span>усталость</span>
                    </p>

                    <p>
                        <strong>Мысли:</strong>
                        <span>семья, сын</span>
                    </p>

                </div>

            </article>

        </section>

    </div>


    <!-- Нижнее меню -->
    <nav class="bottom-tab-bar">

        <a class="tab-pauses" href="history.html">
            <img src="../assets/icons/pause.svg" alt="Паузы">
            <span>Паузы</span>
        </a>

        <a class="tab-lenta" href="lenta.html">
            <img src="../assets/icons/lenta.svg" alt="Лента">
            <span>Лента</span>
        </a>

        <a class="tab-profile" href="profile.html">
            <img src="../assets/icons/user.svg" alt="Профиль">
            <span>Профиль</span>
        </a>

    </nav>

</main>

<script src="../js/script.js"></script>

</body>
</html>

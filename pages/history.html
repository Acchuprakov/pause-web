<!DOCTYPE html>
<html lang="ru">

<head>
    <!-- ======================================================
         БАЗОВЫЕ НАСТРОЙКИ И ШРИФТ
         ====================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мои паузы — ПАУЗА</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Единый файл стилей для всех страниц. -->
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <!-- ======================================================
         DESKTOP HEADER
         На мобильном скрывается существующими стилями.
         Для переходов между страницами используем ссылки.
         ====================================================== -->

    <header class="desktop-header history-desktop-header">

        <a class="brand-logo" href="home.html" aria-label="ПАУЗА — главная">
            <div class="logo-badge"><span>П</span></div>
            <span class="brand-name">ПАУЗА</span>
        </a>

        <nav class="header-tabs" aria-label="Основная навигация">
            <a class="header-tab" href="home.html">Главная</a>
            <a class="header-tab header-tab--active" href="history.html" aria-current="page">Паузы</a>
            <a class="header-tab" href="lenta.html">Лента</a>
            <a class="header-tab" href="#">Пауза+</a>
            <a class="header-tab" href="profile.html">Профиль</a>
        </nav>

        <!-- Имя и аватарка ведут на страницу профиля.
             Сохранённая фотография подставляется через script.js. -->

        <a class="header-action header-action-link" href="profile.html">
            <span class="header-user-name">Александра</span>

            <span class="avatar-small" aria-hidden="true">

                <img class="user-avatar-image" alt="" hidden>

                <span class="icon-user user-avatar-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M12 11.09c-2.452 0-4.444-2.036-4.444-4.541C7.556 4.037 9.548 2 12 2s4.444 2.037 4.444 4.542-1.992 4.549-4.444 4.549m0-7.856c-1.787 0-3.237 1.488-3.237 3.308S10.22 9.85 12 9.85s3.237-1.487 3.237-3.308S13.787 3.234 12 3.234M16.13 22H7.87C5.733 22 4 19.965 4 17.454c0-2.51 1.74-4.545 3.87-4.545h8.26c2.137 0 3.87 2.044 3.87 4.545S18.267 22 16.13 22m-8.26-7.395c-1.336 0-2.426 1.28-2.426 2.85 0 1.568 1.09 2.849 2.426 2.849h8.26c1.336 0 2.426-1.28 2.426-2.85 0-1.568-1.09-2.849-2.426-2.849z" />
                    </svg>
                </span>

            </span>

        </a>

    </header>


    <!-- ======================================================
         ИСТОРИЯ ПАУЗ
         Внешний main — на всю ширину.
         history-content ограничивает содержимое до 800px
         на desktop и до 420px на мобильном.
         ====================================================== -->

    <main class="history-page">

        <div class="history-content">

            <!-- Шапка страницы.
                 Класс header-back сохранён для существующего JS. -->

            <header class="header-bar">

                <button class="header-back" type="button" aria-label="Назад">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        aria-hidden="true">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>

                <h1 class="header-title">Мои паузы</h1>

            </header>


            <!-- ==================================================
                 СПИСОК ПАУЗ — ЗАПОЛНЯЕТСЯ ЧЕРЕЗ script.js

                 Скрипт читает localStorage["pauses"], создаёт
                 .pause-section с заголовками дней и .pause-card.
                 Сохраняем этот контейнер для существующей логики.
                 Примеры карточек вручную добавлять не требуется.
                 ================================================== -->

            <div class="pauses-list"></div>

        </div>


        <!-- ==================================================
             НОВОЕ МОБИЛЬНОЕ МЕНЮ
             Активный пункт — Паузы.
             На desktop скрывается существующими стилями.
             ================================================== -->

        <nav class="bottom-tab-bar-container" aria-label="Мобильная навигация">

            <div class="bottom-tab-bar">

                <!-- Главная -->

                <a class="bottom-tab" href="home.html">
                    <span class="bottom-tab-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M10.213 2.704c.966-.945 2.607-.945 3.615.04l7.056 6.08C21.617 9.54 22 10.445 22 11.407v8.14C22 20.9 20.875 22 19.501 22H14v-7a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v7H4.507C3.124 22 2 20.9 2 19.548v-8.14c0-.962.383-1.866 1.074-2.542z" />
                        </svg>
                    </span>
                    <span class="bottom-tab-label">Главная</span>
                </a>
                <!-- Паузы -->

                <a class="bottom-tab active" href="history.html" aria-current="page">
                    <span class="bottom-tab-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M11.306 22c-.493 0-4.787-.058-6.547-2.18-.63-.759-.872-1.708-.71-2.74l.016-.09c.016-.075.024-.14.04-.207l.299-1.205c.258-.916.524-1.692.823-2.418.331-.793.759-1.552 1.348-2.386.76-1.081 1.671-2.303 2.898-3.054.412-.247 1.058-.536 1.817-.487.767-.05 1.404.231 1.816.487 1.179.718 2.09 1.89 2.906 3.054a13 13 0 0 1 1.348 2.386c.372.875.687 1.84.96 2.938l.17.685c.25 1.106.057 2.122-.58 2.939C16.205 21.942 11.805 22 11.305 22M5.88 16.338l-.226.949c-.097.627.008 1.081.34 1.47 1.089 1.311 4.205 1.6 5.31 1.6h.009c1.13 0 4.303-.297 5.352-1.65.331-.421.412-.917.266-1.544l-.153-.644a20 20 0 0 0-.88-2.699c-.29-.685-.662-1.345-1.178-2.088-.662-.95-1.445-2.006-2.414-2.592-.323-.19-.646-.28-.928-.256l-.073.008-.08-.008c-.275-.025-.606.066-.913.256-.96.586-1.752 1.643-2.414 2.592-.516.743-.888 1.403-1.178 2.088a18 18 0 0 0-.743 2.17zm11.02-7.99c-1.711 0-3.1-1.42-3.1-3.17S15.19 2 16.9 2 20 3.42 20 5.17s-1.389 3.178-3.1 3.178m0-4.697c-.823 0-1.485.685-1.485 1.519s.67 1.518 1.485 1.518 1.486-.685 1.486-1.518c0-.834-.67-1.52-1.486-1.52" />
                        </svg>
                    </span>
                    <span class="bottom-tab-label">Паузы</span>
                </a>
                <!-- Лента -->

                <a class="bottom-tab" href="lenta.html">
                    <span class="bottom-tab-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M16.673 2A5.327 5.327 0 0 1 22 7.327v9.346A5.327 5.327 0 0 1 16.673 22H7.327A5.327 5.327 0 0 1 2 16.673V7.327A5.327 5.327 0 0 1 7.327 2zM7.327 3.589A3.74 3.74 0 0 0 3.59 7.327v9.346a3.74 3.74 0 0 0 3.738 3.738h9.346a3.74 3.74 0 0 0 3.738-3.738V7.327a3.74 3.74 0 0 0-3.738-3.738zM8 14a1 1 0 1 1 0 2 1 1 0 0 1 0-2m8 0a1 1 0 1 1 0 2h-4a1 1 0 1 1 0-2zM8 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2m8 0a1 1 0 1 1 0 2h-4a1 1 0 1 1 0-2z" />
                        </svg>
                    </span>
                    <span class="bottom-tab-label">Лента</span>
                </a>
                <!-- Пауза+ -->

                <a class="bottom-tab" href="#">
                    <span class="bottom-tab-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M10.437 12.959c.973 0 1.769.806 1.769 1.793v5.455c0 .987-.796 1.793-1.77 1.793H8.808c-.973 0-1.77-.806-1.77-1.793v-5.456c0-.986.797-1.792 1.77-1.792zm-1.63 1.422a.37.37 0 0 0-.365.37v5.456c0 .209.169.37.365.37h1.63c.205 0 .364-.17.364-.37v-5.456a.37.37 0 0 0-.364-.37zm11.424-2.523c.973 0 1.769.806 1.769 1.792v1.652c0 .986-.796 1.792-1.77 1.792h-5.383c-.974 0-1.77-.806-1.77-1.792V13.65c0-.986.796-1.792 1.77-1.792zm-5.384 1.423a.37.37 0 0 0-.366.37v1.65c0 .21.17.37.366.37h5.384a.37.37 0 0 0 .364-.37v-1.65a.37.37 0 0 0-.364-.37zM9.153 6.99c.974 0 1.77.806 1.77 1.793v1.66c0 .987-.796 1.793-1.77 1.793H3.77c-.974 0-1.77-.806-1.77-1.793v-1.66c0-.987.796-1.794 1.77-1.794zM15.455 2a1.78 1.78 0 0 1 1.77 1.793v5.456c0 .986-.796 1.792-1.77 1.792h-1.629c-.974 0-1.77-.806-1.77-1.792V3.793c0-.987.797-1.793 1.77-1.793zM3.77 8.414a.37.37 0 0 0-.365.37v1.66c0 .2.16.37.365.37h5.383a.37.37 0 0 0 .366-.37v-1.66a.37.37 0 0 0-.366-.37zm10.056-4.99a.37.37 0 0 0-.365.369v5.456c0 .208.168.37.365.37h1.63a.37.37 0 0 0 .364-.37V3.793a.37.37 0 0 0-.365-.37z" />
                        </svg>
                    </span>
                    <span class="bottom-tab-label">Пауза+</span>
                </a>
                <!-- Профиль -->

                <a class="bottom-tab" href="profile.html">
                    <span class="bottom-tab-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M12 11.09c-2.452 0-4.444-2.036-4.444-4.541C7.556 4.037 9.548 2 12 2s4.444 2.037 4.444 4.542-1.992 4.549-4.444 4.549m0-7.856c-1.787 0-3.237 1.488-3.237 3.308S10.22 9.85 12 9.85s3.237-1.487 3.237-3.308S13.787 3.234 12 3.234M16.13 22H7.87C5.733 22 4 19.965 4 17.454c0-2.51 1.74-4.545 3.87-4.545h8.26c2.137 0 3.87 2.044 3.87 4.545S18.267 22 16.13 22m-8.26-7.395c-1.336 0-2.426 1.28-2.426 2.85 0 1.568 1.09 2.849 2.426 2.849h8.26c1.336 0 2.426-1.28 2.426-2.85 0-1.568-1.09-2.849-2.426-2.849z" />
                        </svg>
                    </span>
                    <span class="bottom-tab-label">Профиль</span>
                </a>

            </div>

        </nav>

    </main>


    <!-- ======================================================
         ОБЩИЙ FOOTER
         Юридические ссылки ведут на разделы, которые будут
         созданы отдельным этапом.
         ====================================================== -->

    <site-footer data-root=".." data-home="home.html"></site-footer>


    <!-- ======================================================
         МОДАЛЬНОЕ ОКНО ПОЛНОГО ПРОСМОТРА ПАУЗЫ
         Содержимое заполняется через script.js после нажатия
         на карточку истории.
         ====================================================== -->

    <div class="pause-details-modal" role="dialog" aria-modal="true" aria-hidden="true"
        aria-labelledby="pause-details-heading">

        <div class="pause-details-overlay"></div>


        <div class="pause-details-wrapper">

            <article class="pause-details-card">

                <div class="pause-details-title-block">

                    <h2 id="pause-details-heading">
                        Запись паузы
                    </h2>

                    <p class="pause-details-date">
                        Дата паузы
                    </p>

                </div>


                <div class="pause-details-duration-row">

                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="currentColor" aria-hidden="true">
                        <path
                            d="M20.182 12c0-4.589-3.698-8.248-8.182-8.248S3.818 7.41 3.818 12 7.516 20.248 12 20.248 20.182 16.59 20.182 12m-9.091-5.474c0-.484.407-.876.909-.876s.909.392.909.876v4.942l3.147 1.58a.86.86 0 0 1 .386 1.181.926.926 0 0 1-1.226.373l-4.125-2.07zM22 12c0 5.489-4.443 10-10 10S2 17.49 2 12C2 6.512 6.443 2 12 2s10 4.512 10 10" />
                    </svg>

                    <span class="pause-details-duration">
                        Время паузы: 00:00
                    </span>

                </div>


                <div class="pause-details-content">

                    <p>
                        <strong>Чувства:</strong>
                        <span class="pause-details-feelings"></span>
                    </p>

                    <p>
                        <strong>Мысли:</strong>
                        <span class="pause-details-thoughts"></span>
                    </p>

                    <p>
                        <strong>Себе:</strong>
                        <span class="pause-details-needs"></span>
                    </p>

                </div>

            </article>


            <button class="pause-details-close" type="button" aria-label="Закрыть запись паузы">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true">
                    <path
                        d="M3.463 2.251a.857.857 0 0 0-1.212 1.212L10.788 12 2.25 20.537a.857.857 0 0 0 1.212 1.212L12 13.212l8.537 8.537a.857.857 0 0 0 1.212-1.212L13.212 12l8.537-8.537a.857.857 0 0 0-1.212-1.212L12 10.788z" />
                </svg>
            </button>

        </div>

    </div>


    <!-- Сохраняем существующую логику страницы.
         history.html находится в pages, поэтому путь через ../. -->

    <script src="../js/footer.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>

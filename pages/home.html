<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ПАУЗА</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

<main class="home-page">

    <!-- Бренд и приветствие -->

    <div class="brand-wrapper">

        <h1 class="display">
            ПАУЗА
        </h1>

        <p class="home-greeting">
            Привет, Александра!
        </p>

    </div>


    <!-- Иллюстрация -->

    <div class="home-intro">

        <img
            src="../assets/icons/pause-stone.png"
            alt="Иллюстрация Пауза"
        >

        <p>
            Сделайте паузу и уделите себе несколько минут внимания.
        </p>

    </div>


    <!-- Сегодняшняя пауза -->

    <section class="today-history-box">

        <div class="card-header">

            <span>СЕГОДНЯ</span>

            <time>14:32</time>

        </div>

        <p class="pause-preview">
            Сегодня я чувствовал усталость и напряжение...
        </p>

        <a class="history-link" href="history.html">
            Смотреть все паузы
        </a>

    </section>


    <!-- Начать паузу -->

    <button class="button-primary home-start-button" type="button">
        Начать паузу
    </button>


    <!-- Нижнее меню -->

    <nav class="bottom-tab-bar">

        <a class="tab-pauses" href="history.html">
            <img src="../assets/icons/pause.svg" alt="Паузы">
            <span>Паузы</span>
        </a>

        <a class="tab-lenta" href="lenta.html">
            <img src="../assets/icons/lenta.svg" alt="Лента">
            <span>Лента</span>
        </a>

        <a class="tab-profile" href="profile.html">
            <img src="../assets/icons/user.svg" alt="Профиль">
            <span>Профиль</span>
        </a>

    </nav>

</main>

<script src="../js/script.js"></script>

</body>
</html>

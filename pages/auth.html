<!DOCTYPE html>
<html lang="ru">

<head>
    <!-- ======================================================
         БАЗОВЫЕ НАСТРОЙКИ
         ====================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Авторизация — ПАУЗА</title>

    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../style/style.css">
</head>


<body>

    <!-- ======================================================
         МОБИЛЬНАЯ СТРАНИЦА АВТОРИЗАЦИИ

         Использует те же классы, что desktop-модалка:
         - auth-modal-card
         - auth-modal-heading
         - auth-modal-form
         - auth-modal-submit
         - auth-register-only

         Поэтому регистрация и вход управляются одной логикой.
         ====================================================== -->

    <main class="auth-page">

        <!-- Возврат на гостевую главную -->

        <header class="auth-page-header">

            <a class="auth-page-back" href="../index.html" aria-label="Вернуться назад">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    aria-hidden="true">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    </path>
                </svg>
            </a>

        </header>


        <!-- Общая карточка регистрации и входа -->

        <section class="auth-modal-card auth-page-card" data-auth-mode="register">

            <!-- Заголовок -->

            <div class="auth-modal-title-block">

                <h1 class="auth-modal-heading">
                    Чтобы сохранить паузу —<br>
                    создайте аккаунт
                </h1>

                <p class="auth-modal-subtitle">
                    Это займет меньше минуты
                </p>

            </div>


            <!-- Переключение режима -->

            <div class="segment-tabs auth-mode-tabs" aria-label="Режим авторизации">

                <button class="tab-active auth-mode-tab" type="button" data-auth-tab="register" aria-pressed="true">
                    Регистрация
                </button>

                <button class="tab-inactive auth-mode-tab" type="button" data-auth-tab="login" aria-pressed="false">
                    Вход
                </button>

            </div>


            <!-- Общая форма -->

            <form class="auth-modal-form auth-page-form">

                <!-- Имя показывается только при регистрации -->

                <div class="form-field auth-register-only">

                    <label for="auth-page-name">
                        ИМЯ
                    </label>

                    <div class="input-container">

                        <input id="auth-page-name" type="text" name="name" placeholder="Введите имя"
                            autocomplete="name">

                    </div>

                </div>


                <!-- Email используется в обоих режимах -->

                <div class="form-field">

                    <label for="auth-page-email">
                        EMAIL
                    </label>

                    <div class="input-container">

                        <input id="auth-page-email" type="email" name="email" placeholder="Введите email"
                            autocomplete="email" required>

                    </div>

                </div>


                <!-- Пароль -->

                <div class="form-field">

                    <label for="auth-page-password">
                        ПАРОЛЬ
                    </label>

                    <div class="input-container password-container">

                        <input id="auth-page-password" class="password-input" type="password" name="password"
                            placeholder="Введите пароль" autocomplete="new-password" required>


                        <!-- Показать или скрыть пароль -->

                        <button class="password-toggle" type="button" aria-label="Показать пароль"
                            aria-controls="auth-page-password" aria-pressed="false">

                            <!-- Обычный глаз -->

                            <span class="password-toggle-icon password-toggle-icon--show" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="currentColor">
                                    <path
                                        d="M12 4.25c1.964 0 3.869.849 5.501 2.11 1.535 1.186 2.872 2.77 3.85 4.474l.191.343.091.197c.182.47.152 1.001-.09 1.45l-.002.001c-.991 1.834-2.403 3.55-4.04 4.815-1.632 1.261-3.537 2.11-5.5 2.11s-3.869-.849-5.502-2.11c-1.534-1.186-2.872-2.77-3.85-4.474l-.19-.343a1.74 1.74 0 0 1 0-1.647v-.001c.991-1.834 2.404-3.55 4.04-4.815C8.132 5.1 10.037 4.25 12 4.25m0 1.5c-1.531 0-3.122.667-4.584 1.797-1.457 1.126-2.738 2.676-3.638 4.342a.24.24 0 0 0 0 .221l.174.31c.887 1.548 2.098 2.976 3.464 4.032C8.878 17.582 10.47 18.25 12 18.25c1.532 0 3.122-.668 4.583-1.797 1.458-1.126 2.739-2.676 3.64-4.342a.24.24 0 0 0 0-.221c-.901-1.666-2.182-3.216-3.64-4.342C15.122 6.418 13.532 5.75 12 5.75M9.374 9.374a3.714 3.714 0 0 1 5.252 0l.132.138a3.715 3.715 0 1 1-5.384-.138m4.069.853a2.286 2.286 0 1 0 .33.33l-.156-.173z">
                                    </path>
                                </svg>
                            </span>


                            <!-- Перечёркнутый глаз -->

                            <span class="password-toggle-icon password-toggle-icon--hide" aria-hidden="true" hidden>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="currentColor">
                                    <path
                                        d="M18.47 4.47a.75.75 0 0 1 1.06 1.06L7.505 17.556l-.023.023-1.95 1.951a.75.75 0 0 1-1.06-1.06l1.371-1.373a15.7 15.7 0 0 1-3.384-4.272 1.74 1.74 0 0 1 0-1.648l.19-.343C3.629 9.129 4.966 7.546 6.5 6.36 8.132 5.1 10.037 4.25 12 4.25c1.753 0 3.459.678 4.966 1.722zm.121 3.88a.75.75 0 0 1 1.058.084c.632.74 1.205 1.541 1.69 2.38l.202.362c.264.489.274 1.072.037 1.57l-.036.078c-.991 1.834-2.404 3.55-4.04 4.816-1.633 1.261-3.538 2.11-5.502 2.11-.948 0-1.883-.2-2.775-.545a.751.751 0 0 1 .541-1.4 6.4 6.4 0 0 0 1.957.437l.276.008H12c1.532 0 3.123-.668 4.584-1.798 1.452-1.122 2.728-2.663 3.627-4.32l.01-.02a.24.24 0 0 0 0-.223 14.3 14.3 0 0 0-1.713-2.48.75.75 0 0 1 .083-1.058m-6.59-2.6c-1.532 0-3.123.668-4.585 1.798-1.457 1.126-2.738 2.676-3.638 4.342a.24.24 0 0 0 0 .221l.173.31a14.2 14.2 0 0 0 2.954 3.613l1.858-1.858a3.902 3.902 0 0 1 5.413-5.413l1.711-1.711C14.625 6.226 13.292 5.75 12 5.75m1.08 4.107a2.4 2.4 0 0 0-2.778.446 2.4 2.4 0 0 0-.444 2.777z">
                                    </path>
                                </svg>
                            </span>

                        </button>

                    </div>

                </div>

            </form>


            <!-- Основное действие -->

            <button class="button-primary auth-modal-submit auth-page-submit" type="button">
                Зарегистрироваться
            </button>


            <!-- Показывается только при регистрации -->

            <p class="auth-consent auth-register-only">
                Нажимая кнопку «Зарегистрироваться», я подтверждаю, что ознакомился с
                <a href="../legal/privacy/" target="_blank">
                    Политикой конфиденциальности
                </a>
                и
                <a href="../legal/offer/" target="_blank">
                    договором оферты
                </a>.
            </p>

        </section>

    </main>


    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->

    <script src="../js/script.js"></script>

</body>

</html>
